<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@900&display=swap">
<style>
html, body { margin: 0; width: 1400px; height: 1400px; overflow: hidden; }
body { background: #1d6b70; font-family: "Zen Maru Gothic", sans-serif; position: relative; }
.sun { position: absolute; width: 900px; height: 900px; border-radius: 50%; background: #e07a3f; left: 250px; top: 520px; }
.wave { position: absolute; left: 0; right: 0; height: 40px; border-radius: 20px; background: #f2ede3; opacity: .9; }
.t { position: absolute; left: 0; right: 0; top: 170px; text-align: center; color: #f2ede3; font-weight: 900; font-size: 360px; letter-spacing: 10px; line-height: 1; }
.s { position: absolute; left: 0; right: 0; top: 560px; text-align: center; color: #f2ede3; font-weight: 900; font-size: 84px; letter-spacing: 6px; }
.bars { position: absolute; left: 330px; right: 330px; bottom: 170px; height: 300px; display: flex; gap: 26px; align-items: flex-end; }
.bars i { flex: 1; background: #f2ede3; border-radius: 18px 18px 6px 6px; }
</style></head>
<body>
<div class="sun"></div>
<div class="t">幸FM</div>
<div class="s">毎朝10分のラジオ</div>
<div class="bars"><i style="height:35%"></i><i style="height:70%"></i><i style="height:100%"></i><i style="height:55%"></i><i style="height:85%"></i><i style="height:40%"></i><i style="height:65%"></i></div>
</body></html>
